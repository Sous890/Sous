{% extends "base.html" %}
{% block title %}Chat — Team Agent{% endblock %}
{% block content %}
<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;">
  <h1 style="margin:0;">Chat</h1>
  <button id="resetBtn" class="btn btn-outline btn-sm">Reset conversation</button>
</div>

<div id="log" style="
  background:#fff;
  border:1px solid #e5e5e5;
  border-radius:6px;
  padding:16px;
  min-height:320px;
  max-height:560px;
  overflow-y:auto;
  display:flex;
  flex-direction:column;
  gap:14px;
  margin-bottom:16px;
  font-size:14px;
">
  <div style="color:#aaa;text-align:center;padding:40px 0;" id="emptyState">
    Ask me anything about your tasks, or tell me to create and assign work.
  </div>
</div>

<div style="display:flex;gap:10px;">
  <textarea id="input" rows="2"
    style="flex:1;padding:10px 14px;border:1px solid #ccc;border-radius:4px;font-size:14px;font-family:inherit;resize:none;"
    placeholder="Type a message… (Enter to send, Shift+Enter for newline)"></textarea>
  <button id="micBtn" title="Speak" style="
    align-self:flex-end;
    padding:10px 14px;
    border:1px solid #ccc;
    border-radius:4px;
    background:#fff;
    font-size:18px;
    cursor:pointer;
    line-height:1;
    display:none;
  ">🎤</button>
  <button id="sendBtn" class="btn" style="align-self:flex-end;padding:10px 20px;">Send</button>
</div>

<script>
  const log = document.getElementById('log');
  const input = document.getElementById('input');
  const sendBtn = document.getElementById('sendBtn');
  const micBtn = document.getElementById('micBtn');
  const resetBtn = document.getElementById('resetBtn');
  const emptyState = document.getElementById('emptyState');

  // Share session_id with the mini-chat widget via localStorage
  const _UID       = "{{ current_user.id }}";
  const _LS_SID    = `ta_chat_sid_${_UID}`;
  const _LS_HIST   = `ta_chat_hist_${_UID}`;
  let sessionId = localStorage.getItem(_LS_SID) || crypto.randomUUID();
  localStorage.setItem(_LS_SID, sessionId);

  let busy = false;

  // Replay any history stored by the mini-chat widget
  (function _replayHistory() {
    let hist = [];
    try { hist = JSON.parse(localStorage.getItem(_LS_HIST) || '[]'); } catch(_) {}
    if (!hist.length) return;
    for (const msg of hist) {
      if (msg.role && msg.text) addBubble(msg.role, msg.text);
    }
  })();

  function addBubble(role, text) {
    const es = document.getElementById('emptyState');
    if (es) es.remove();
    const isUser = role === 'user';
    const wrap = document.createElement('div');
    wrap.style.cssText = `display:flex;flex-direction:column;align-items:${isUser ? 'flex-end' : 'flex-start'};`;
    const bubble = document.createElement('div');
    bubble.dataset.role = role;
    bubble.style.cssText = `
      max-width:80%;
      background:${isUser ? '#111' : '#f5f5f5'};
      color:${isUser ? '#fff' : '#111'};
      border-radius:${isUser ? '12px 12px 2px 12px' : '12px 12px 12px 2px'};
      padding:10px 14px;
      white-space:pre-wrap;
      word-break:break-word;
      font-size:14px;
      line-height:1.5;
    `;
    bubble.textContent = text;
    wrap.appendChild(bubble);
    log.appendChild(wrap);
    log.scrollTop = log.scrollHeight;
    return bubble;
  }

  async function send() {
    const q = input.value.trim();
    if (!q || busy) return;
    busy = true;
    input.value = '';
    sendBtn.disabled = true;
    sendBtn.textContent = '…';

    addBubble('user', q);
    const thinking = addBubble('agent', 'Thinking…');
    thinking.style.color = '#aaa';
    thinking.style.fontStyle = 'italic';

    try {
      const res = await fetch('/ask', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({session_id: sessionId, question: q}),
      });
      let data;
      try { data = await res.json(); } catch (_) { data = {}; }
      if (!res.ok) {
        thinking.style.color = '#c0392b';
        thinking.style.fontStyle = 'normal';
        thinking.textContent = 'Error: ' + (data.error || `Server error ${res.status}`);
      } else {
        thinking.style.color = '#111';
        thinking.style.fontStyle = 'normal';
        thinking.textContent = data.answer || data.error || '(no response)';
        if (data.session_id) { sessionId = data.session_id; localStorage.setItem(_LS_SID, sessionId); }
      }
      _saveHist();
    } catch (err) {
      thinking.style.color = '#c0392b';
      thinking.style.fontStyle = 'normal';
      thinking.textContent = 'Error: could not reach server. Check your connection.';
    }

    busy = false;
    sendBtn.disabled = false;
    sendBtn.textContent = 'Send';
    input.focus();
  }

  sendBtn.addEventListener('click', send);
  input.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
  });

  // Serialize visible bubbles to localStorage so the mini-chat widget stays in sync
  function _saveHist() {
    const bubbles = log.querySelectorAll('[data-role]');
    const hist = [];
    let n = 0;
    for (const b of bubbles) {
      if (++n > 100) break;
      hist.push({ role: b.dataset.role, text: b.textContent });
    }
    localStorage.setItem(_LS_HIST, JSON.stringify(hist));
  }

  resetBtn.addEventListener('click', async () => {
    await fetch('/reset', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({session_id: sessionId}),
    });
    sessionId = crypto.randomUUID();
    localStorage.setItem(_LS_SID, sessionId);
    localStorage.removeItem(_LS_HIST);
    log.innerHTML = '<div style="color:#aaa;text-align:center;padding:40px 0;">Conversation reset. Ask me anything.</div>';
  });

  // --- Speech-to-text: true continuous toggle with auto-restart on silence ---
  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (SpeechRecognition) {
    micBtn.style.display = 'block';
    const recognition = new SpeechRecognition();
    recognition.lang = 'en-US';
    recognition.continuous = true;        // keep listening across pauses
    recognition.interimResults = false;
    recognition.maxAlternatives = 1;
    let micOn = false;  // true = user wants mic active

    function startMic() {
      try { recognition.start(); } catch(_) { /* already started */ }
    }

    function stopMic() {
      micOn = false;
      try { recognition.stop(); } catch(_) {}
      micBtn.textContent = '🎤';
      micBtn.title = 'Speak';
      micBtn.style.background = '#fff';
      micBtn.style.borderColor = '#ccc';
      micBtn.style.color = '';
    }

    micBtn.addEventListener('click', () => {
      if (micOn) {
        stopMic();
      } else {
        micOn = true;
        startMic();
      }
    });

    recognition.addEventListener('start', () => {
      micBtn.textContent = '🔴';
      micBtn.title = 'Listening — click to stop';
      micBtn.style.background = '#fff0f0';
      micBtn.style.borderColor = '#e74c3c';
      micBtn.style.color = '#e74c3c';
    });

    // Auto-restart on silence/timeout if user still wants mic active
    recognition.addEventListener('end', () => {
      if (micOn) {
        // Chrome stops after ~10 s of silence — restart transparently
        setTimeout(startMic, 80);
      } else {
        micBtn.textContent = '🎤';
        micBtn.title = 'Speak';
        micBtn.style.background = '#fff';
        micBtn.style.borderColor = '#ccc';
        micBtn.style.color = '';
      }
    });

    recognition.addEventListener('result', e => {
      // Collect all new final results from this event
      let transcript = '';
      for (let i = e.resultIndex; i < e.results.length; i++) {
        if (e.results[i].isFinal) transcript += e.results[i][0].transcript;
      }
      if (transcript) {
        input.value = (input.value + ' ' + transcript).trim();
        input.focus();
      }
    });

    recognition.addEventListener('error', e => {
      // Swallow benign errors; surface real ones
      if (e.error === 'no-speech' || e.error === 'audio-capture') return;
      micBtn.title = `Mic error: ${e.error}`;
      stopMic();
    });
  }
</script>
{% endblock %}
